<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
        
        <!-- Logo Badge -->
        <g id="logo-badge" transform="translate(840, 30)">
          <!-- Glassmorphic / Solid Shadow Card -->
          <rect width="210" height="54" rx="14" fill="#0F172A" fill-opacity="0.9" />
          <rect width="210" height="54" rx="14" fill="none" stroke="#059669" stroke-width="2" />
          
          <!-- Icon Symbol -->
          <circle cx="32" cy="27" r="14" fill="#059669" />
          <path d="M26 27 L30 31 L38 23" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          
          <!-- Brand Typography -->
          <text x="56" y="27" font-family="'Cairo', 'Tajawal', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">
            مخزن الرحمة
          </text>
          <text x="56" y="43" font-family="'Cairo', 'Tajawal', sans-serif" font-size="10" fill="#F59E0B">
            أوفر سعر وجودة لكل بيت
          </text>
        </g>
      

        <!-- Discount / Deal Badge -->
        <g id="discount-badge" transform="translate(30, 30)">
          <defs>
            <linearGradient id="dealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#DC2626" />
              <stop offset="100%" stop-color="#991B1B" />
            </linearGradient>
            <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
            </filter>
          </defs>
          <rect width="160" height="48" rx="24" fill="url(#dealGrad)" filter="url(#badgeShadow)" />
          <rect width="160" height="48" rx="24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.6" />
          
          <text x="80" y="30" font-family="'Cairo', 'Tajawal', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            🔥 خصم 31%
          </text>
        </g>
      

        <!-- Custom Pill Badge -->
        <g id="custom-pill" transform="translate(30, 90)">
          <rect width="140" height="34" rx="8" fill="#059669" fill-opacity="0.95" />
          <text x="70" y="22" font-family="'Cairo', 'Tajawal', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            ⭐ خامة أصلية 100%
          </text>
        </g>
      

        <!-- Price Tag -->
        <g id="price-card" transform="translate(30, 930)">
          <rect width="230" height="72" rx="16" fill="#0F172A" fill-opacity="0.92" />
          <rect width="230" height="72" rx="16" fill="none" stroke="#F59E0B" stroke-width="2" />
          
          
            <text x="210" y="28" font-family="'Cairo', 'Tajawal', sans-serif" font-size="13" fill="#94A3B8" text-anchor="end" text-decoration="line-through">
              بدلاً من: 4200 ج.م
            </text>
          
          
          <text x="210" y="56" font-family="'Cairo', 'Tajawal', sans-serif" font-size="22" font-weight="900" fill="#F59E0B" text-anchor="end">
            فقط 2899 ج.م
          </text>
        </g>
      

        <!-- Footer Trust Bar -->
        <g id="footer-trust-bar" transform="translate(0, 1022)">
          <rect width="1080" height="58" fill="#065f46" />
          <rect width="1080" height="3" y="0" fill="#F59E0B" />
          
          <text x="540" y="36" font-family="'Cairo', 'Tajawal', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
            🚚 شحن لكل مصر | 📦 معاينة قبل الاستلام | 💬 اطلب الآن
          </text>
        </g>
      
      </svg>