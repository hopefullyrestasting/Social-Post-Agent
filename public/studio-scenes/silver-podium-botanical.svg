<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="45%" stop-color="#EEF2F6"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="wallGlow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="podiumTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#D9E2EC"/>
    </linearGradient>
    <linearGradient id="podiumFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="40%" stop-color="#C7D2DF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="45%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1200" fill="url(#wallGlow)"/>

  <!-- crisp tropical leaves framing lower corners -->
  <g id="leaves-left" fill="#166534">
    <path d="M-30 1180 C 70 980, 170 940, 260 1020 C 170 1060, 90 1120, 30 1260 Z" fill-opacity="0.92"/>
    <path d="M-10 1265 C 70 1080, 160 1030, 240 1095 C 150 1140, 80 1200, 40 1340 Z" fill-opacity="0.82"/>
    <path d="M40 1320 C 110 1180, 190 1140, 250 1185 C 180 1220, 120 1265, 90 1385 Z" fill-opacity="0.72"/>
    <path d="M20 1110 C 120 960, 220 930, 300 990 C 210 1030, 130 1080, 70 1200 Z" fill-opacity="0.78"/>
  </g>
  <g id="leaves-right" fill="#166534" transform="translate(1080,0) scale(-1,1)">
    <path d="M-30 1180 C 70 980, 170 940, 260 1020 C 170 1060, 90 1120, 30 1260 Z" fill-opacity="0.92"/>
    <path d="M-10 1265 C 70 1080, 160 1030, 240 1095 C 150 1140, 80 1200, 40 1340 Z" fill-opacity="0.82"/>
    <path d="M40 1320 C 110 1180, 190 1140, 250 1185 C 180 1220, 120 1265, 90 1385 Z" fill-opacity="0.72"/>
    <path d="M20 1110 C 120 960, 220 930, 300 990 C 210 1030, 130 1080, 70 1200 Z" fill-opacity="0.78"/>
  </g>

  <!-- sharp 3D hexagonal white & brushed-silver podium -->
  <g id="podium">
    <ellipse cx="540" cy="1432" rx="430" ry="56" fill="#0F172A" fill-opacity="0.10"/>
    <polygon points="180,1288 900,1288 830,1402 250,1402" fill="url(#podiumFront)"/>
    <polygon points="250,1402 830,1402 830,1428 250,1428" fill="#7C8CA1" fill-opacity="0.35"/>
    <polygon points="180,1288 250,1402 250,1428 180,1314" fill="#94A3B8" fill-opacity="0.28"/>
    <polygon points="900,1288 830,1402 830,1428 900,1314" fill="#94A3B8" fill-opacity="0.18"/>
    <polygon points="220,1288 860,1288 800,1228 280,1228" fill="url(#podiumTop)"/>
    <ellipse cx="540" cy="1228" rx="260" ry="28" fill="#FFFFFF" fill-opacity="0.55"/>
    <polygon points="280,1228 800,1228 760,1188 320,1188" fill="#FFFFFF"/>
    <polygon points="320,1188 760,1188 760,1210 320,1210" fill="#CBD5E1" fill-opacity="0.45"/>
    <ellipse cx="540" cy="1188" rx="220" ry="22" fill="#F8FAFC"/>
    <line x1="220" y1="1288" x2="860" y2="1288" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2"/>
    <line x1="280" y1="1228" x2="800" y2="1228" stroke="#CBD5E1" stroke-opacity="0.6" stroke-width="2"/>
  </g>

  <!-- subtle 3D matte silver spheres -->
  <g id="spheres">
    <circle cx="170" cy="360" r="58" fill="url(#metal)"/>
    <circle cx="152" cy="342" r="14" fill="#FFFFFF" fill-opacity="0.55"/>
    <circle cx="910" cy="420" r="82" fill="url(#metal)"/>
    <circle cx="884" cy="394" r="18" fill="#FFFFFF" fill-opacity="0.5"/>
    <circle cx="860" cy="680" r="34" fill="url(#metal)"/>
    <circle cx="848" cy="668" r="8" fill="#FFFFFF" fill-opacity="0.5"/>
    <circle cx="230" cy="700" r="28" fill="url(#metal)"/>
  </g>
</svg>
