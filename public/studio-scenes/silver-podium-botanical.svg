<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3F5F7"/>
      <stop offset="38%" stop-color="#E9EDF2"/>
      <stop offset="72%" stop-color="#E3E8EE"/>
      <stop offset="100%" stop-color="#D9E1EA"/>
    </linearGradient>
    <linearGradient id="wall-softlight" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="marble-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F6F8FA"/>
      <stop offset="70%" stop-color="#EDF2F7"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="marble-vein" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0"/>
      <stop offset="40%" stop-color="#CBD5E1" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#94A3B8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="silver-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="30%" stop-color="#DDE5EE"/>
      <stop offset="55%" stop-color="#C4CFDB"/>
      <stop offset="100%" stop-color="#9FB0C2"/>
    </linearGradient>
    <linearGradient id="silver-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9EEF4"/>
      <stop offset="45%" stop-color="#C9D4E0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <radialGradient id="pearl" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="45%" stop-color="#F1F5F9" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#CBD5E1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softAmbient" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Soft silver-grey studio wall -->
  <rect width="1080" height="1920" fill="url(#bg-wall)"/>
  <rect width="1080" height="1200" fill="url(#wall-softlight)"/>
  <ellipse cx="540" cy="620" rx="520" ry="380" fill="#FFFFFF" fill-opacity="0.18" filter="url(#softAmbient)"/>

  <!-- Subtle diagonal botanical leaf shadows on wall -->
  <g id="wall-leaf-shadows" filter="url(#leafShadow)" fill="#64748B" opacity="0.10">
    <path d="M-40 420 C 120 260, 260 240, 360 340 C 240 360, 120 430, 20 560 Z" transform="rotate(-18 160 380)"/>
    <path d="M60 520 C 200 380, 320 360, 420 450 C 300 470, 190 540, 110 660 Z" transform="rotate(-12 240 500)"/>
    <path d="M760 360 C 900 240, 1040 230, 1120 330 C 1010 350, 900 420, 820 540 Z" transform="rotate(14 940 360)"/>
    <path d="M820 520 C 960 390, 1080 380, 1160 480 C 1040 500, 930 560, 860 680 Z" transform="rotate(10 1000 520)"/>
  </g>

  <!-- Floating glossy silver-pearl spheres -->
  <g id="pearl-spheres">
    <circle cx="150" cy="360" r="54" fill="url(#pearl)" fill-opacity="0.75"/>
    <circle cx="132" cy="340" r="12" fill="#FFFFFF" fill-opacity="0.7"/>
    <circle cx="930" cy="420" r="78" fill="url(#pearl)" fill-opacity="0.78"/>
    <circle cx="904" cy="392" r="16" fill="#FFFFFF" fill-opacity="0.65"/>
    <circle cx="860" cy="690" r="30" fill="url(#pearl)" fill-opacity="0.7"/>
    <circle cx="849" cy="678" r="7" fill="#FFFFFF" fill-opacity="0.65"/>
    <circle cx="230" cy="700" r="24" fill="url(#pearl)" fill-opacity="0.68"/>
  </g>

  <!-- Lush green palm fronds & eucalyptus leaves framing bottom corners -->
  <g id="foliage-bottom-left">
    <g fill="#1F6F43">
      <path d="M-40 1260 C 70 1040, 180 980, 290 1055 C 190 1100, 100 1170, 20 1310 Z" fill-opacity="0.95"/>
      <path d="M-20 1335 C 70 1120, 170 1060, 270 1125 C 175 1175, 90 1245, 35 1385 Z" fill-opacity="0.86"/>
      <path d="M30 1390 C 115 1210, 205 1160, 295 1215 C 205 1255, 130 1315, 90 1440 Z" fill-opacity="0.78"/>
      <path d="M30 1185 C 130 1010, 230 970, 330 1040 C 230 1080, 150 1140, 80 1260 Z" fill-opacity="0.84"/>
      <path d="M90 1120 C 180 980, 260 955, 340 1015 C 255 1050, 185 1100, 130 1200 Z" fill-opacity="0.74"/>
    </g>
    <g fill="#2F855A">
      <ellipse cx="120" cy="1320" rx="22" ry="10" transform="rotate(-30 120 1320)" fill-opacity="0.75"/>
      <ellipse cx="160" cy="1295" rx="20" ry="9" transform="rotate(-18 160 1295)" fill-opacity="0.72"/>
      <ellipse cx="200" cy="1265" rx="18" ry="8" transform="rotate(-10 200 1265)" fill-opacity="0.7"/>
      <ellipse cx="95" cy="1240" rx="18" ry="8" transform="rotate(-35 95 1240)" fill-opacity="0.7"/>
      <ellipse cx="145" cy="1210" rx="17" ry="8" transform="rotate(-22 145 1210)" fill-opacity="0.68"/>
    </g>
  </g>
  <g id="foliage-bottom-right" transform="translate(1080,0) scale(-1,1)">
    <g fill="#1F6F43">
      <path d="M-40 1260 C 70 1040, 180 980, 290 1055 C 190 1100, 100 1170, 20 1310 Z" fill-opacity="0.95"/>
      <path d="M-20 1335 C 70 1120, 170 1060, 270 1125 C 175 1175, 90 1245, 35 1385 Z" fill-opacity="0.86"/>
      <path d="M30 1390 C 115 1210, 205 1160, 295 1215 C 205 1255, 130 1315, 90 1440 Z" fill-opacity="0.78"/>
      <path d="M30 1185 C 130 1010, 230 970, 330 1040 C 230 1080, 150 1140, 80 1260 Z" fill-opacity="0.84"/>
      <path d="M90 1120 C 180 980, 260 955, 340 1015 C 255 1050, 185 1100, 130 1200 Z" fill-opacity="0.74"/>
    </g>
    <g fill="#2F855A">
      <ellipse cx="120" cy="1320" rx="22" ry="10" transform="rotate(-30 120 1320)" fill-opacity="0.75"/>
      <ellipse cx="160" cy="1295" rx="20" ry="9" transform="rotate(-18 160 1295)" fill-opacity="0.72"/>
      <ellipse cx="200" cy="1265" rx="18" ry="8" transform="rotate(-10 200 1265)" fill-opacity="0.7"/>
      <ellipse cx="95" cy="1240" rx="18" ry="8" transform="rotate(-35 95 1240)" fill-opacity="0.7"/>
      <ellipse cx="145" cy="1210" rx="17" ry="8" transform="rotate(-22 145 1210)" fill-opacity="0.68"/>
    </g>
  </g>

  <!-- 3D white marble & brushed-silver hexagonal podium (centered lower third, empty top surface) -->
  <g id="hex-podium">
    <!-- ground ambient shadow -->
    <ellipse cx="540" cy="1308" rx="420" ry="58" fill="#0F172A" fill-opacity="0.10" filter="url(#softAmbient)"/>
    <ellipse cx="540" cy="1292" rx="320" ry="34" fill="#334155" fill-opacity="0.10"/>

    <!-- podium base/front (brushed silver) -->
    <polygon points="220,1230 860,1230 790,1320 290,1320" fill="url(#silver-front)"/>
    <polygon points="220,1230 290,1320 290,1348 220,1258" fill="#94A3B8" fill-opacity="0.32"/>
    <polygon points="860,1230 790,1320 790,1348 860,1258" fill="#94A3B8" fill-opacity="0.22"/>
    <polygon points="290,1320 790,1320 790,1348 290,1348" fill="#7F93A8" fill-opacity="0.30"/>

    <!-- hexagonal top slab (white marble) -->
    <!-- top surface y around 1230, hex shape centered at 540 -->
    <polygon points="310,1230 770,1230 860,1200 770,1170 310,1170 220,1200" fill="url(#marble-top)"/>
    <polygon points="310,1170 770,1170 860,1200 770,1230 310,1230 220,1200" fill="#FFFFFF" fill-opacity="0.12"/>
    <!-- subtle marble veining -->
    <path d="M300 1198 C 420 1186, 520 1210, 640 1194 S 760 1184, 820 1202" stroke="url(#marble-vein)" stroke-width="3" fill="none"/>
    <path d="M330 1212 C 450 1202, 560 1222, 690 1208" stroke="#94A3B8" stroke-opacity="0.10" stroke-width="2" fill="none"/>

    <!-- brushed silver rim/edge -->
    <polyline points="310,1230 770,1230 860,1200 770,1170 310,1170 220,1200 310,1230" fill="none" stroke="#CBD5E1" stroke-opacity="0.8" stroke-width="2"/>
    <line x1="220" y1="1200" x2="860" y2="1200" stroke="#E2E8F0" stroke-opacity="0.55" stroke-width="2"/>
    <ellipse cx="540" cy="1200" rx="260" ry="22" fill="#FFFFFF" fill-opacity="0.22"/>

    <!-- upper bevel highlight -->
    <polygon points="350,1178 730,1178 785,1198 730,1218 350,1218 295,1198" fill="#FFFFFF" fill-opacity="0.18"/>
  </g>
</svg>
