name = "social-post-agent"
pages_build_output_dir = "./out"
compatibility_date = "2026-11-14"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "makhzan-al-rahma"
database_id = "d25f54b6-61ca-4c6f-8468-7273ea971844"

# Optional: permanent storage for dashboard-uploaded product packshots.
# The uploader falls back to optimized embedded data URIs when this bucket is
# not bound, so the feature works before R2 is provisioned. To enable:
#   1. npx wrangler r2 bucket create al-rahma-product-assets
#   2. uncomment the block below and redeploy.
# [[r2_buckets]]
# binding = "PRODUCT_ASSETS"
# bucket_name = "al-rahma-product-assets"

# Vision AI for the Smart Asset Matcher (/api/assets/vision-match).
# Never put the key in this file. Bind it as a Pages secret instead:
#   npx wrangler pages secret put GEMINI_API_KEY
# Without it the endpoint falls back to Workers AI
# (@cf/meta/llama-3.2-11b-vision-instruct), then to filename matching.
